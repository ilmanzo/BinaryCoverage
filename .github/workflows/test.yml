name: Run unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install required tools
        run: sudo apt update && sudo apt install -y golang-go bpftrace g++ make python3 elfutils

      - name: Run unit tests
        run: ./run_unit_tests.sh

      - name: Build project
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Compile sample test binary
        run: make -C tests/sample

      - name: Run E2E tests (no bpftrace, prerequisites only)
        run: sudo python3 tests/e2e/test_coverage.py TestPrerequisites TestInstallUninstall TestEnumerate
